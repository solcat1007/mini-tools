<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>占位文本生成器</title>
<style>
/* ============================================================
   白色极简主题 — 纯白底 + 黑字 + 黑边框
   ============================================================ */
:root {
  --bg: #ffffff;
  --panel-bg: #fafafa;
  --text: #111111;
  --text-light: #555555;
  --border: #000000;
  --accent: #000000;
  --accent-hover: #333333;
  --success: #111111;
  --danger: #cc0000;
  --radius: 0px;
  --font-mono: "Cascadia Code","SF Mono","Fira Code","Consolas","Monaco",monospace;
  --font-sans: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-sans); background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
.titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: var(--panel-bg);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.titlebar h1 { font-size: 1rem; font-weight: 600; }
.titlebar-controls { display: flex; gap: 8px; }
.btn {
  padding: 6px 16px; border: 1px solid var(--border);
  background: #fff; color: var(--text); font-size: 0.82rem;
  cursor: pointer; font-family: inherit; transition: all 0.1s;
}
.btn:hover { background: var(--accent); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 0.75rem; }
.help-panel {
  margin: 0; border-bottom: 1px solid var(--border);
  background: #fff; flex-shrink: 0;
}
.help-panel summary {
  padding: 8px 20px; cursor: pointer; font-size: 0.78rem;
  font-weight: 600; color: var(--text-light); user-select: none;
}
.help-panel summary:hover { color: var(--text); }
.help-content {
  padding: 0 20px 14px; font-size: 0.78rem; color: var(--text-light);
  line-height: 1.7;
}
.help-content h3 { font-size: 0.85rem; color: var(--text); margin: 8px 0 4px; }
.help-content ul { padding-left: 18px; margin: 2px 0 6px; }
.help-content kbd {
  padding: 1px 6px; border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 0.72rem; background: #f5f5f5;
}
.main {
  flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 20px;
  gap: 14px;
}
/* Tab */
.tab-row {
  display: flex; gap: 0; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.tab {
  padding: 8px 18px; border: none; background: #fff;
  font-size: 0.85rem; cursor: pointer; color: var(--text-light);
  border-bottom: 2px solid transparent; transition: all 0.1s;
  font-family: inherit;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--border); }
/* 控制区 */
.control-bar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 16px; border: 1px solid var(--border); flex-shrink: 0;
}
.control-group { display: flex; align-items: center; gap: 6px; }
.control-group label { font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.control-group input[type=number] {
  width: 64px; padding: 4px 8px; border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 0.82rem; text-align: center;
  background: #fff; color: var(--text);
}
.control-group input[type=number]:focus { outline: none; border-width: 2px; }
.control-group select {
  padding: 4px 8px; border: 1px solid var(--border);
  font-size: 0.82rem; background: #fff; color: var(--text);
}
/* 结果区 */
.output-area {
  flex: 1; overflow-y: auto; border: 1px solid var(--border);
  padding: 16px; background: #fff; font-size: 0.9rem; line-height: 1.7;
  word-wrap: break-word;
}
.output-area p { margin: 4px 0; }
.output-area span { font-family: var(--font-mono); white-space: pre-wrap; }
.output-area div { white-space: pre-wrap; }
/* 统计行 */
.stat-row {
  display: flex; gap: 16px; font-size: 0.78rem; color: var(--text-light);
  flex-shrink: 0;
}
.stat-row span { font-weight: 600; color: var(--text); }
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 8px 20px; background: var(--panel-bg); border: 1px solid var(--border);
  font-size: 0.82rem; z-index: 999; opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="titlebar">
  <h1>占位文本生成器</h1>
  <div class="titlebar-controls">
    <button class="btn btn-sm" onclick="generate()" title="生成 Ctrl+G">生成文本</button>
    <button class="btn btn-sm" onclick="copyOutput()" title="复制 Ctrl+C">复制全部</button>
    <button class="btn btn-sm" onclick="exportTXT()">导出 TXT</button>
  </div>
</div>

<details class="help-panel" open>
  <summary>使用说明</summary>
  <div class="help-content">
    <h3>占位文本生成器</h3>
    <p>快速生成中文乱数假文或英文 Lorem Ipsum 占位文本，用于页面排版和设计预览。</p>
    <h3>主要功能</h3>
    <ul>
      <li><strong>中文模式</strong>：基于《千字文》+现代语义混合生成的乱数假文</li>
      <li><strong>英文模式</strong>：标准 Lorem Ipsum 拉丁文（Cicero 公元前45年）</li>
      <li>按段落数、句子数或总字数三种方式精确控制生成量</li>
      <li>支持 HTML 标签包裹（p / span / div），方便直接粘贴到代码中</li>
    </ul>
    <h3>快捷键</h3>
    <ul>
      <li><kbd>Ctrl+G</kbd> 生成文本</li>
      <li><kbd>Ctrl+C</kbd> 复制结果</li>
    </ul>
  </div>
</details>

<div class="main">
  <div class="tab-row">
    <button class="tab active" onclick="switchTab('cn',this)">中文乱数假文</button>
    <button class="tab" onclick="switchTab('en',this)">Lorem Ipsum</button>
  </div>

  <div class="control-bar">
    <div class="control-group">
      <label>生成方式</label>
      <select id="genMode" onchange="onModeChange()">
        <option value="paragraphs">段落数</option>
        <option value="sentences">句子数</option>
        <option value="words">字数</option>
      </select>
    </div>
    <div class="control-group">
      <label>数量</label>
      <input type="number" id="genCount" value="3" min="1" max="200">
    </div>
    <div class="control-group">
      <label>HTML标签</label>
      <select id="htmlTag">
        <option value="">无标签</option>
        <option value="p">&lt;p&gt;</option>
        <option value="span">&lt;span&gt;</option>
        <option value="div">&lt;div&gt;</option>
      </select>
    </div>
    <button class="btn btn-sm" onclick="generate()">生成</button>
  </div>

  <div class="output-area" id="output"></div>

  <div class="stat-row" id="statRow" style="display:none">
    共生成 <span id="charCount">0</span> 个字符 / <span id="paraCount">0</span> 段 / <span id="sentCount">0</span> 句
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentLang="cn";

// 中文词库
const CN_WORDS=[
  "天地玄黄","宇宙洪荒","日月盈昃","辰宿列张","寒来暑往","秋收冬藏",
  "金生丽水","玉出昆冈","剑号巨阙","珠称夜光","海咸河淡","鳞潜羽翔",
  "龙师火帝","鸟官人皇","始制文字","乃服衣裳","推位让国","有虞陶唐",
  "用户体验","界面设计","数据驱动","高效开发","响应式布局","跨平台兼容",
  "技术架构","性能优化","持续集成","自动化测试","云端部署","微服务",
  "前端框架","后端引擎","数据库索引","缓存策略","负载均衡","消息队列",
  "简洁的设计带来更高效的工作体验","团队协作是项目成功的关键要素",
  "技术方案的选择直接影响产品迭代速度","数据分析为决策提供有力支撑",
  "随着移动互联网的普及","在当前数字化转型的浪潮中","从实际应用角度来看",
  "通过不断的技术创新","结合多年的行业经验","根据最新的市场调研",
  "我们致力于打造","不仅需要关注","与此同时","除此之外","另一方面",
  "可以预见","综上所述","总而言之","由此可见","换言之",
];
const CN_CONJ=["的","了","在","是","与","和","或","而","但","且","因为","所以","如果","虽然","因此",
  "于是","然后","接着","另外","同时","此外","最后","首先","其次","再次","终于",
  "一个","这个","那个","每个","所有","一些","某种","任何"];

const EN_WORDS=[
  "lorem","ipsum","dolor","sit","amet","consectetur","adipiscing","elit",
  "sed","do","eiusmod","tempor","incididunt","ut","labore","et","dolore","magna","aliqua",
  "enim","ad","minim","veniam","quis","nostrud","exercitation","ullamco",
  "laboris","nisi","ut","aliquip","ex","ea","commodo","consequat",
  "duis","aute","irure","dolor","in","reprehenderit","in","voluptate",
  "velit","esse","cillum","dolore","eu","fugiat","nulla","pariatur",
  "excepteur","sint","occaecat","cupidatat","non","proident","sunt",
  "culpa","qui","officia","deserunt","mollit","anim","id","est","laborum",
  "facilisis","gravida","neque","convallis","cras","semper","auctor",
  "neque","vitae","tempus","quam","pellentesque","nec","nam","aliquam",
];

function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function genCnWord(){
  return pick(CN_WORDS);
}

function genCnSentence(minLen=8,maxLen=25){
  let s="";
  const target=randInt(minLen,maxLen);
  while(s.length<target){
    if(Math.random()<0.6){
      s+=genCnWord();
    }else{
      s+=pick(CN_CONJ);
    }
  }
  return s+"。";
}

function genEnWord(){
  return pick(EN_WORDS);
}

function genEnSentence(minWords=5,maxWords=18){
  const count=randInt(minWords,maxWords);
  let s="";
  for(let i=0;i<count;i++) s+=genEnWord()+" ";
  return s.trim().charAt(0).toUpperCase()+s.trim().slice(1)+".";
}

function genCnParagraph(sentCount=randInt(3,7)){
  let p="";
  for(let i=0;i<sentCount;i++) p+=genCnSentence();
  return p;
}

function genEnParagraph(sentCount=randInt(4,8)){
  let p="";
  for(let i=0;i<sentCount;i++) p+=genEnSentence()+" ";
  return p.trim();
}

function generate(){
  const mode=document.getElementById("genMode").value;
  const count=parseInt(document.getElementById("genCount").value)||3;
  const tag=document.getElementById("htmlTag").value;
  let result="";
  let totalChars=0, totalParas=0, totalSents=0;

  if(currentLang==="cn"){
    if(mode==="paragraphs"){
      for(let i=0;i<count;i++){
        const sc=randInt(3,7);
        const p=genCnParagraph(sc);
        result+=wrapTag(p,tag,i<count-1)+"\n";
        totalParas++; totalSents+=sc; totalChars+=p.length;
      }
    }else if(mode==="sentences"){
      for(let i=0;i<count;i++){
        const s=genCnSentence();
        result+=wrapInline(s,tag)+" ";
        totalSents++; totalChars+=s.length;
      }
      totalParas=1;
    }else{
      let cur=0;
      while(cur<count){
        const s=genCnSentence();
        result+=wrapInline(s,tag)+" ";
        cur+=s.length; totalSents++;
      }
      totalCharEstimate(); totalParas=1;
    }
  }else{
    if(mode==="paragraphs"){
      for(let i=0;i<count;i++){
        const sc=randInt(4,8);
        const p=genEnParagraph(sc);
        result+=wrapTag(p,tag,i<count-1)+"\n";
        totalParas++; totalSents+=sc; totalChars+=p.length;
      }
    }else if(mode==="sentences"){
      for(let i=0;i<count;i++){
        const s=genEnSentence();
        result+=wrapInline(s,tag)+" ";
        totalSents++; totalChars+=s.length;
      }
      totalParas=1;
    }else{
      let cur=0;
      while(cur<count){
        const s=genEnSentence();
        result+=wrapInline(s,tag)+" ";
        cur+=s.split(" ").length; totalSents++;
      }
      totalChars=result.length; totalParas=1;
    }
  }

  totalChars=result.length;
  document.getElementById("output").textContent=result.trim();
  document.getElementById("statRow").style.display="flex";
  document.getElementById("charCount").textContent=totalChars;
  document.getElementById("paraCount").textContent=totalParas;
  document.getElementById("sentCount").textContent=totalSents;
}

function totalCharEstimate(){
  // 已在上面处理
}

function wrapTag(text,tag,addNewline){
  if(!tag) return text;
  if(tag==="p") return `<${tag}>${text}</${tag}>`;
  return `<${tag}>${text}</${tag}>`+(addNewline?"\n":"");
}

function wrapInline(text,tag){
  if(!tag) return text;
  return `<${tag}>${text}</${tag}>`;
}

function switchTab(lang,btn){
  currentLang=lang;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  generate();
}

function onModeChange(){
  const mode=document.getElementById("genMode").value;
  document.getElementById("genCount").value=mode==="words"?"100":"3";
  generate();
}

function copyOutput(){
  const text=document.getElementById("output").textContent;
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>toastMsg("已复制到剪贴板"));
}

function exportTXT(){
  const text=document.getElementById("output").textContent;
  if(!text) return;
  const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="placeholder.txt"; a.click();
  URL.revokeObjectURL(url);
  toastMsg("已导出 TXT");
}

function toastMsg(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.classList.remove("show"),1800);
}

document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.key==="g"){ e.preventDefault(); generate(); }
  if(e.ctrlKey&&e.key==="c"&&!e.target.closest("input,textarea,select")){ e.preventDefault(); copyOutput(); }
});

generate();
</script>
<script>
/* ============================================================
 * SOLCAT EASTER EGG PROTOCOL v2.0 — 通用彩蛋引擎
 * 零依赖 · 单文件 · 可注入任意 HTML 项目

(function(){
  'use strict';
  if (window.__SOLCAT_EGG__) return;
  window.__SOLCAT_EGG__ = { version:'2.0', unlocked:new Set(), onUnlock:[] };

  /* ---------- 1. 控制台署名（ASCII Art） ---------- */

  /* ---------- 2. 烟花彩带粒子 ---------- */
  function confetti(){
    var colors = ['#26a69a','#42a5f5','#ef5350','#ffca28','#ab47bc','#66bb6a','#ff7043'];
    var cvs = document.createElement('canvas');
    cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999';
    document.body.appendChild(cvs);
    var ctx = cvs.getContext('2d'), W = cvs.width = innerWidth, H = cvs.height = innerHeight;
    var P = [];
    for (var i=0;i<180;i++) P.push({
      x:W/2+(Math.random()-.5)*120, y:H*.4+(Math.random()-.5)*40,
      vx:(Math.random()-.5)*18, vy:-Math.random()*16-4,
      c:colors[i%colors.length], s:Math.random()*8+4, r:Math.random()*6,
      life:1, spin:(Math.random()-.5)*.3
    });
    var f = 0;
    (function draw(){
      f++; ctx.clearRect(0,0,W,H);
      P.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.vx*=.99; p.r+=p.spin; p.life-=.006;
        if(p.life<=0) return;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=p.life;
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
      });
      if (f<180) requestAnimationFrame(draw); else cvs.remove();
    })();
  }

  /* ---------- 3. 隐藏开发者面板 ---------- */
  function devPanel(app){
    var old = document.getElementById('__egg_panel');
    if (old){ old.remove(); return; }
    var d = document.createElement('div');
    d.id='__egg_panel';
    d.style.cssText='position:fixed;bottom:20px;right:20px;z-index:99998;width:280px;'+
      'background:rgba(18,20,26,.94);color:#e0e0e0;border:1px solid #26a69a;border-radius:14px;'+

      '<div>协议　　: EGG PROTOCOL v'+E.version+'</div>'+
      '<div>解锁数　: '+E.unlocked.size+'</div>'+

      '已解锁: '+Array.from(E.unlocked).join(', ')+'</div>'+
      '<button onclick="this.parentNode.remove()" style="margin-top:12px;width:100%;padding:6px;'+
      'background:#26a69a;color:#fff;border:0;border-radius:6px;cursor:pointer">关闭</button>';
    document.body.appendChild(d);
  }

  /* ---------- 4. 隐藏主题（赛博朋克） ---------- */
  function cyberTheme(){
    var s=document.getElementById('__egg_cyber');
    if(s){ s.remove(); document.body.classList.remove('egg-cyber'); return; }
    s=document.createElement('style'); s.id='__egg_cyber';
    s.textContent='body.egg-cyber{filter:invert(1) hue-rotate(180deg)!important;}'+
      'body.egg-cyber *{font-family:"Courier New",monospace!important;letter-spacing:1px}';
    document.head.appendChild(s); document.body.classList.add('egg-cyber');
    unlock('cyber','☠ 赛博模式已启用');
  }

  /* ---------- 5. 解锁分发 ---------- */
  function unlock(id,msg){
    if (E.unlocked.has(id)) return;
    E.unlocked.add(id);
    if (msg) console.log('%c[EGG] '+msg,'color:#ffca28;font-weight:bold');
    E.onUnlock.forEach(function(fn){ try{fn(id);}catch(e){} });
    var t=document.createElement('div');
    t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);'+
      'z-index:99997;background:rgba(18,20,26,.92);color:#ffca28;padding:18px 28px;'+ 
      'border:1px solid #ffca28;border-radius:12px;font:14px ui-monospace,monospace;'+
      'pointer-events:none;animation:eggIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4)';
    t.textContent='☠ '+msg;
    document.body.appendChild(t); setTimeout(function(){t.remove();},2200);
  }

  /* ---------- 6. 事件绑定 ---------- */
  function init(){
    var app = document.title || 'SOLCAT App';
    banner();

    // Konami 秘籍
    addEventListener('keydown', function(e){
      var k = e.key.length===1 ? e.key.toLowerCase() : e.key;
      seq.push(k); if(seq.length>KONAMI.length) seq.shift();
      if (seq.length===KONAMI.length && KONAMI.every(function(v,i){return seq[i]===v;})){
        seq=[]; confetti(); unlock('konami','KONAMI CODE 已激活！');
      }
      // Ctrl+Shift+T → 赛博主题
      if (e.ctrlKey && e.shiftKey && (e.key==='T'||e.key==='t')){
        e.preventDefault(); cyberTheme();
      }
      // 输入 solcat
      if (e.key==='Enter' && window.__eggBuf__ === 'solcat'){ cyberTheme(); window.__eggBuf__=''; }
      if (k.length===1) window.__eggBuf__ = ((window.__eggBuf__||'')+k).slice(-10);
    });

    // 连点标题 5 次 → 开发者面板
    addEventListener('DOMContentLoaded', function(){
      var targets = document.querySelectorAll('h1,.head h1,.logo,header h1');
      var t = targets[0];
      if(t){ t.style.cursor='default'; t.addEventListener('click',function(){
        logoClicks++;
        clearTimeout(logoTimer);
        logoTimer=setTimeout(function(){logoClicks=0;},900);
        if(logoClicks>=5){ logoClicks=0; devPanel(app); unlock('dev','开发者模式已解锁'); }
      });}
      // 给 body 加动画 keyframe
      var a=document.createElement('style');
      a.textContent='@keyframes eggIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}';
      document.head.appendChild(a);
    });

    console.log('%c☠ 彩蛋引擎已加载 — 祝你玩得开心','color:#26a69a');
  }

  if (document.readyState==='loading') addEventListener('DOMContentLoaded',init);
  else init();
})();

</script>
<script>

/* ============================================================
 * SOLCAT 专属彩蛋（由升级脚本注入，保持单文件）
 * ============================================================ */
(function(){
  var E=window.__SOLCAT_EGG__; if(!E)return;
  var NAME='Lorem 生成器', MSG='Lorem ipsum solcat dolor';
  function toast(msg){
    var t=document.getElementById('toast');
    if(t&&t.classList&&t.style){t.textContent='\u2620 '+msg;t.classList.add('show');
      clearTimeout(t._eggTid);t._eggTid=setTimeout(function(){t.classList.remove('show')},2600);return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99996;'+
      'background:#111;color:#fff;padding:9px 22px;border:1px solid #111;font:13px "Segoe UI","PingFang SC",sans-serif;'+
      'letter-spacing:1px;pointer-events:none;transition:opacity .5s';
    d.textContent='\u2620 '+msg;document.body.appendChild(d);
    setTimeout(function(){d.style.opacity='0'},1600);
    setTimeout(function(){d.remove()},2200);
  }
  function badge(){
    if(document.getElementById('__egg_badge'))return;
    var b=document.createElement('div');b.id='__egg_badge';
    b.style.cssText='position:fixed;bottom:14px;right:14px;z-index:99995;background:#111;color:#fff;'+
      'padding:5px 12px;font:11px monospace;letter-spacing:1px;pointer-events:none';
    b.textContent='\u2620 SOLCAT · '+NAME;document.body.appendChild(b);
  }
  E.onUnlock.push(function(k){
    if(k!=='konami')return;
    badge();toast(MSG);
  });
})();

</script>
