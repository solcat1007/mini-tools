<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表格生成器</title>
<style>
/* ============================================================
   白色极简主题 — 纯白底 + 黑字 + 黑边框
   ============================================================ */
:root {
  --bg: #ffffff;
  --panel-bg: #fafafa;
  --text: #111111;
  --text-light: #555555;
  --border: #000000;
  --accent: #000000;
  --accent-hover: #333333;
  --success: #111111;
  --danger: #cc0000;
  --radius: 0px;
  --font-mono: "Cascadia Code","SF Mono","Fira Code","Consolas","Monaco",monospace;
  --font-sans: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-sans); background: var(--bg); color: var(--text);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
.titlebar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: var(--panel-bg);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.titlebar h1 { font-size: 1rem; font-weight: 600; }
.titlebar-controls { display: flex; gap: 8px; }
.btn {
  padding: 6px 16px; border: 1px solid var(--border);
  background: #fff; color: var(--text); font-size: 0.82rem;
  cursor: pointer; font-family: inherit; transition: all 0.1s;
}
.btn:hover { background: var(--accent); color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 0.75rem; }
.help-panel {
  margin: 0; border-bottom: 1px solid var(--border);
  background: #fff; flex-shrink: 0;
}
.help-panel summary {
  padding: 8px 20px; cursor: pointer; font-size: 0.78rem;
  font-weight: 600; color: var(--text-light); user-select: none;
}
.help-panel summary:hover { color: var(--text); }
.help-content {
  padding: 0 20px 14px; font-size: 0.78rem; color: var(--text-light);
  line-height: 1.7;
}
.help-content h3 { font-size: 0.85rem; color: var(--text); margin: 8px 0 4px; }
.help-content ul { padding-left: 18px; margin: 2px 0 6px; }
.help-content kbd {
  padding: 1px 6px; border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 0.72rem; background: #f5f5f5;
}
.main {
  flex: 1; overflow: hidden; display: flex; flex-direction: column;
  padding: 16px; gap: 10px;
}
/* 控制栏 */
.control-bar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; border: 1px solid var(--border); flex-shrink: 0;
}
.control-group { display: flex; align-items: center; gap: 4px; }
.control-group label { font-size: 0.82rem; font-weight: 600; }
.control-group input[type=number] {
  width: 56px; padding: 4px 6px; border: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 0.82rem; text-align: center;
  background: #fff; color: var(--text);
}
.control-group input[type=number]:focus { outline: none; border-width: 2px; }
.control-group select {
  padding: 4px 8px; border: 1px solid var(--border);
  font-size: 0.82rem; background: #fff; color: var(--text);
}
.sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
/* 表格编辑区 */
.table-wrapper {
  flex: 1; overflow: auto; border: 1px solid var(--border);
  background: #fff; min-height: 0;
}
.edit-table {
  border-collapse: collapse; width: max-content; min-width: 100%;
}
.edit-table th, .edit-table td {
  border: 1px solid #ddd; padding: 0; min-width: 80px;
  position: relative;
}
.edit-table th { background: var(--panel-bg); }
.edit-table th input, .edit-table td input {
  width: 100%; padding: 6px 8px; border: none; background: transparent;
  font-size: 0.85rem; color: var(--text); outline: none;
  font-family: inherit;
}
.edit-table th input:focus, .edit-table td input:focus {
  background: #fff; outline: 2px solid var(--border); outline-offset: -2px;
}
.edit-table th input { font-weight: 600; }
/* 对齐指示 */
.edit-table .align-left input { text-align: left; }
.edit-table .align-center input { text-align: center; }
.edit-table .align-right input { text-align: right; }
/* 预览区 */
.preview-section {
  flex-shrink: 0; border: 1px solid var(--border); overflow: hidden;
  display: flex; flex-direction: column;
}
.preview-tabs {
  display: flex; gap: 0; border-bottom: 1px solid var(--border);
  background: var(--panel-bg);
}
.preview-tab {
  padding: 6px 14px; border: none; background: transparent;
  font-size: 0.78rem; cursor: pointer; color: var(--text-light);
  border-bottom: 2px solid transparent; transition: all 0.1s;
  font-family: inherit;
}
.preview-tab:hover { color: var(--text); }
.preview-tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--border); }
.preview-content {
  padding: 10px 14px; background: var(--panel-bg);
  font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.5;
  white-space: pre-wrap; word-break: break-all;
  max-height: 180px; overflow-y: auto; color: var(--text);
}
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  padding: 8px 20px; background: var(--panel-bg); border: 1px solid var(--border);
  font-size: 0.82rem; z-index: 999; opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="titlebar">
  <h1>表格生成器</h1>
  <div class="titlebar-controls">
    <button class="btn btn-sm" onclick="updateTable()">刷新表格</button>
    <button class="btn btn-sm" onclick="copyPreview()">复制预览内容</button>
  </div>
</div>

<details class="help-panel" open>
  <summary>使用说明</summary>
  <div class="help-content">
    <h3>表格生成器</h3>
    <p>可视化表格编辑器，直接在单元格中输入内容，一键导出 Markdown 或 HTML 格式。</p>
    <h3>主要功能</h3>
    <ul>
      <li>设置行列数，表头自动加粗居中</li>
      <li>单元格直接点击编辑，实时更新预览</li>
      <li>支持表头行和所有单元格的对齐方式设置（左/中/右）</li>
      <li>导出 Markdown 表格和 HTML 表格两种格式</li>
    </ul>
    <h3>步骤</h3>
    <ul>
      <li>设置行列 → 双击单元格编辑 → 选择对齐方式 → 点击导出</li>
      <li>可添加/删除行来调整表格大小</li>
    </ul>
    <h3>快捷键</h3>
    <ul>
      <li><kbd>Tab</kbd> 在单元格间移动</li>
      <li><kbd>Ctrl+M</kbd> 复制 Markdown</li>
      <li><kbd>Ctrl+H</kbd> 复制 HTML</li>
    </ul>
  </div>
</details>

<div class="main">
  <div class="control-bar">
    <div class="control-group">
      <label>行</label>
      <input type="number" id="rowCount" value="4" min="1" max="30" onchange="updateTable()">
    </div>
    <div class="control-group">
      <label>列</label>
      <input type="number" id="colCount" value="3" min="1" max="15" onchange="updateTable()">
    </div>
    <div class="sep"></div>
    <div class="control-group">
      <label>表头对齐</label>
      <select id="headerAlign" onchange="applyAlignment()">
        <option value="left">左对齐</option>
        <option value="center" selected>居中</option>
        <option value="right">右对齐</option>
      </select>
    </div>
    <div class="sep"></div>
    <button class="btn btn-sm" onclick="addRow()">+ 行</button>
    <button class="btn btn-sm" onclick="removeRow()">- 行</button>
    <button class="btn btn-sm" onclick="clearTable()">清空内容</button>
    <div class="sep"></div>
    <button class="btn btn-sm" onclick="exportMD()">导出 Markdown</button>
    <button class="btn btn-sm" onclick="exportHTML()">导出 HTML</button>
  </div>

  <!-- 表格编辑区 -->
  <div class="table-wrapper">
    <table class="edit-table" id="editTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- 预览区 -->
  <div class="preview-section">
    <div class="preview-tabs">
      <button class="preview-tab active" onclick="switchPreview('md',this)">Markdown 预览</button>
      <button class="preview-tab" onclick="switchPreview('html',this)">HTML 预览</button>
    </div>
    <div class="preview-content" id="previewContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let previewMode="md";

function updateTable(){
  const rows=parseInt(document.getElementById("rowCount").value)||4;
  const cols=parseInt(document.getElementById("colCount").value)||3;
  const hAlign=document.getElementById("headerAlign").value;

  // 保存现有数据
  const data=getTableData();
  saveCurrentData();

  const thead=document.getElementById("tableHead");
  const tbody=document.getElementById("tableBody");

  // Header
  let hHTML='<tr>';
  for(let c=0;c<cols;c++){
    const val=data[0]&&data[0][c]!==undefined?data[0][c]:(c===0?"列 "+(c+1):"");
    hHTML+=`<th class="align-${hAlign}"><input type="text" value="${escapeAttr(val)}" placeholder="表头${c+1}" oninput="refreshPreview()"></th>`;
  }
  hHTML+='</tr>';
  thead.innerHTML=hHTML;

  // Body
  let bHTML='';
  for(let r=1;r<rows;r++){
    bHTML+='<tr>';
    for(let c=0;c<cols;c++){
      const val=data[r]&&data[r][c]!==undefined?data[r][c]:"";
      bHTML+=`<td><input type="text" value="${escapeAttr(val)}" placeholder="..." oninput="refreshPreview()"></td>`;
    }
    bHTML+='</tr>';
  }
  tbody.innerHTML=bHTML;

  refreshPreview();
}

function saveCurrentData(){
  // Data is read dynamically, no need to save
}

function getTableData(){
  const data=[];
  const thead=document.getElementById("tableHead");
  const tbody=document.getElementById("tableBody");
  if(thead.querySelector("tr")){
    const row=[];
    thead.querySelectorAll("input").forEach(inp=>row.push(inp.value));
    data.push(row);
  }
  tbody.querySelectorAll("tr").forEach(tr=>{
    const row=[];
    tr.querySelectorAll("input").forEach(inp=>row.push(inp.value));
    data.push(row);
  });
  return data;
}

function applyAlignment(){
  const align=document.getElementById("headerAlign").value;
  document.querySelectorAll("#tableHead th").forEach(th=>{
    th.className="align-"+align;
  });
  refreshPreview();
}

function addRow(){
  const cols=parseInt(document.getElementById("colCount").value)||3;
  const tbody=document.getElementById("tableBody");
  let html='<tr>';
  for(let c=0;c<cols;c++) html+=`<td><input type="text" value="" placeholder="..." oninput="refreshPreview()"></td>`;
  html+='</tr>';
  tbody.insertAdjacentHTML("beforeend",html);
  document.getElementById("rowCount").value=parseInt(document.getElementById("rowCount").value)+1;
  refreshPreview();
}

function removeRow(){
  const tbody=document.getElementById("tableBody");
  const rows=tbody.querySelectorAll("tr");
  if(rows.length===0) return;
  rows[rows.length-1].remove();
  document.getElementById("rowCount").value=Math.max(1,parseInt(document.getElementById("rowCount").value)-1);
  refreshPreview();
}

function clearTable(){
  document.querySelectorAll("#editTable input").forEach(inp=>inp.value="");
  refreshPreview();
}

function getCurrentData(){
  const data=[];
  document.querySelectorAll("#tableHead tr").forEach(tr=>{
    const row=[];
    tr.querySelectorAll("input").forEach(inp=>row.push(inp.value));
    data.push(row);
  });
  document.querySelectorAll("#tableBody tr").forEach(tr=>{
    const row=[];
    tr.querySelectorAll("input").forEach(inp=>row.push(inp.value));
    data.push(row);
  });
  return data;
}

function toMarkdown(data){
  if(data.length===0) return "";
  const cols=data[0].length;
  let md="";
  // Header
  md+="| "+data[0].map(c=>c||" ").join(" | ")+" |\n";
  // Separator
  const hAlign=document.getElementById("headerAlign").value;
  let sepMap={left:":---",center:":---:",right:"---:"};
  let sep=sepMap[hAlign]||":---:";
  md+="| "+Array(cols).fill(sep).join(" | ")+" |\n";
  // Body
  for(let r=1;r<data.length;r++){
    md+="| "+data[r].map(c=>c||" ").join(" | ")+" |\n";
  }
  return md;
}

function toHTML(data){
  if(data.length===0) return "";
  const hAlign=document.getElementById("headerAlign").value;
  let html='<table>\n  <thead>\n    <tr>\n';
  for(const cell of data[0]){
    html+=`      <th style="text-align:${hAlign}">${escapeHTML(cell||"&nbsp;")}</th>\n`;
  }
  html+='    </tr>\n  </thead>\n  <tbody>\n';
  for(let r=1;r<data.length;r++){
    html+='    <tr>\n';
    for(const cell of data[r]){
      html+=`      <td>${escapeHTML(cell||"&nbsp;")}</td>\n`;
    }
    html+='    </tr>\n';
  }
  html+='  </tbody>\n</table>';
  return html;
}

function refreshPreview(){
  const data=getCurrentData();
  const content=previewMode==="md"?toMarkdown(data):toHTML(data);
  document.getElementById("previewContent").textContent=content;
}

function switchPreview(mode,btn){
  previewMode=mode;
  document.querySelectorAll(".preview-tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  refreshPreview();
}

function copyPreview(){
  const text=document.getElementById("previewContent").textContent;
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>toastMsg("已复制"+ (previewMode==="md"?"Markdown":"HTML")));
}

function exportMD(){
  const data=getCurrentData();
  const md=toMarkdown(data);
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="table.md"; a.click();
  URL.revokeObjectURL(url);
  toastMsg("已导出 table.md");
}

function exportHTML(){
  const data=getCurrentData();
  const html=toHTML(data);
  const blob=new Blob([html],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="table.html"; a.click();
  URL.revokeObjectURL(url);
  toastMsg("已导出 table.html");
}

function escapeAttr(s){ return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escapeHTML(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function toastMsg(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._tid);
  t._tid=setTimeout(()=>t.classList.remove("show"),1800);
}

document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.key==="m"){ e.preventDefault(); previewMode="md"; refreshPreview(); copyPreview(); }
  if(e.ctrlKey&&e.key==="h"&&!e.ctrlKey){}
  if(e.ctrlKey&&!e.shiftKey&&e.key==="h"){ e.preventDefault(); previewMode="html"; refreshPreview(); copyPreview(); }
});

updateTable();
</script>
<script>
/* ============================================================
 * SOLCAT EASTER EGG PROTOCOL v2.0 — 通用彩蛋引擎
 * 零依赖 · 单文件 · 可注入任意 HTML 项目
 * ============================================================ */
(function(){
  'use strict';
  if (window.__SOLCAT_EGG__) return;
  window.__SOLCAT_EGG__ = { version:'2.0', unlocked:new Set(), onUnlock:[] };

  var E = window.__SOLCAT_EGG__;
  var KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  var seq = [], logoClicks = 0, logoTimer = null;

  /* ---------- 1. 控制台署名（ASCII Art） ---------- */
  function banner(){
    var art = '%c\n  ____             _   _       _   _   \n' +
      ' / ___|  ___  _ __| |_(_) __ _| |_| |__  \n' +
      ' \\___ \\ / _ \\| \'__| __| |/ _` | __| \'_ \\ \n' +
      '  ___) | (_) | |  | |_| | (_| | |_| | | |\n' +
      ' |____/ \\___/|_|   \\__|_|\\__,_|\\__|_| |_|\n';
    console.log(art, 'color:#26a69a;font-family:monospace;font-weight:bold');
    console.log('%c☠ SOLCAT EASTER EGG PROTOCOL v2.0 — 你找到了隐藏入口',
      'color:#666;font-size:11px;letter-spacing:1px');
    console.log('%c提示：↑↑↓↓←→←→BA · 连点标题 5 次 · 输入 solcat · Ctrl+Shift+T',
      'color:#999;font-size:10px');
  }

  /* ---------- 2. 烟花彩带粒子 ---------- */
  function confetti(){
    var colors = ['#26a69a','#42a5f5','#ef5350','#ffca28','#ab47bc','#66bb6a','#ff7043'];
    var cvs = document.createElement('canvas');
    cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999';
    document.body.appendChild(cvs);
    var ctx = cvs.getContext('2d'), W = cvs.width = innerWidth, H = cvs.height = innerHeight;
    var P = [];
    for (var i=0;i<180;i++) P.push({
      x:W/2+(Math.random()-.5)*120, y:H*.4+(Math.random()-.5)*40,
      vx:(Math.random()-.5)*18, vy:-Math.random()*16-4,
      c:colors[i%colors.length], s:Math.random()*8+4, r:Math.random()*6,
      life:1, spin:(Math.random()-.5)*.3
    });
    var f = 0;
    (function draw(){
      f++; ctx.clearRect(0,0,W,H);
      P.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.vx*=.99; p.r+=p.spin; p.life-=.006;
        if(p.life<=0) return;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=p.life;
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
      });
      if (f<180) requestAnimationFrame(draw); else cvs.remove();
    })();
  }

  /* ---------- 3. 隐藏开发者面板 ---------- */
  function devPanel(app){
    var old = document.getElementById('__egg_panel');
    if (old){ old.remove(); return; }
    var d = document.createElement('div');
    d.id='__egg_panel';
    d.style.cssText='position:fixed;bottom:20px;right:20px;z-index:99998;width:280px;'+
      'background:rgba(18,20,26,.94);color:#e0e0e0;border:1px solid #26a69a;border-radius:14px;'+
      'padding:18px;font:12px/1.7 ui-monospace,monospace;backdrop-filter:blur(12px);'+
      'box-shadow:0 12px 40px rgba(0,0,0,.4);animation:eggIn .3s ease';
    d.innerHTML='<div style="color:#26a69a;font-weight:bold;font-size:13px;margin-bottom:10px">'+
      '☠ SOLCAT 开发者模式</div>'+
      '<div>应用　　: '+app+'</div>'+
      '<div>协议　　: EGG PROTOCOL v'+E.version+'</div>'+
      '<div>解锁数　: '+E.unlocked.size+'</div>'+
      '<div>UA　　　: '+(navigator.userAgent.slice(0,38))+'…</div>'+
      '<div>屏幕　　: '+innerWidth+'×'+innerHeight+'</div>'+
      '<div>运行时间: '+Math.round(performance.now()/1000)+'s</div>'+
      '<div style="color:#888;margin-top:10px;border-top:1px solid #333;padding-top:8px">'+
      '已解锁: '+Array.from(E.unlocked).join(', ')+'</div>'+
      '<button onclick="this.parentNode.remove()" style="margin-top:12px;width:100%;padding:6px;'+
      'background:#26a69a;color:#fff;border:0;border-radius:6px;cursor:pointer">关闭</button>';
    document.body.appendChild(d);
  }

  /* ---------- 4. 隐藏主题（赛博朋克） ---------- */
  function cyberTheme(){
    var s=document.getElementById('__egg_cyber');
    if(s){ s.remove(); document.body.classList.remove('egg-cyber'); return; }
    s=document.createElement('style'); s.id='__egg_cyber';
    s.textContent='body.egg-cyber{filter:invert(1) hue-rotate(180deg)!important;}'+
      'body.egg-cyber *{font-family:"Courier New",monospace!important;letter-spacing:1px}';
    document.head.appendChild(s); document.body.classList.add('egg-cyber');
    unlock('cyber','☠ 赛博模式已启用');
  }

  /* ---------- 5. 解锁分发 ---------- */
  function unlock(id,msg){
    if (E.unlocked.has(id)) return;
    E.unlocked.add(id);
    if (msg) console.log('%c[EGG] '+msg,'color:#ffca28;font-weight:bold');
    E.onUnlock.forEach(function(fn){ try{fn(id);}catch(e){} });
    var t=document.createElement('div');
    t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);'+
      'z-index:99997;background:rgba(18,20,26,.92);color:#ffca28;padding:18px 28px;'+ 
      'border:1px solid #ffca28;border-radius:12px;font:14px ui-monospace,monospace;'+
      'pointer-events:none;animation:eggIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4)';
    t.textContent='☠ '+msg;
    document.body.appendChild(t); setTimeout(function(){t.remove();},2200);
  }

  /* ---------- 6. 事件绑定 ---------- */
  function init(){
    var app = document.title || 'SOLCAT App';
    banner();

    // Konami 秘籍
    addEventListener('keydown', function(e){
      var k = e.key.length===1 ? e.key.toLowerCase() : e.key;
      seq.push(k); if(seq.length>KONAMI.length) seq.shift();
      if (seq.length===KONAMI.length && KONAMI.every(function(v,i){return seq[i]===v;})){
        seq=[]; confetti(); unlock('konami','KONAMI CODE 已激活！');
      }
      // Ctrl+Shift+T → 赛博主题
      if (e.ctrlKey && e.shiftKey && (e.key==='T'||e.key==='t')){
        e.preventDefault(); cyberTheme();
      }
      // 输入 solcat
      if (e.key==='Enter' && window.__eggBuf__ === 'solcat'){ cyberTheme(); window.__eggBuf__=''; }
      if (k.length===1) window.__eggBuf__ = ((window.__eggBuf__||'')+k).slice(-10);
    });

    // 连点标题 5 次 → 开发者面板
    addEventListener('DOMContentLoaded', function(){
      var targets = document.querySelectorAll('h1,.head h1,.logo,header h1');
      var t = targets[0];
      if(t){ t.style.cursor='default'; t.addEventListener('click',function(){
        logoClicks++;
        clearTimeout(logoTimer);
        logoTimer=setTimeout(function(){logoClicks=0;},900);
        if(logoClicks>=5){ logoClicks=0; devPanel(app); unlock('dev','开发者模式已解锁'); }
      });}
      // 给 body 加动画 keyframe
      var a=document.createElement('style');
      a.textContent='@keyframes eggIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}';
      document.head.appendChild(a);
    });

    console.log('%c☠ 彩蛋引擎已加载 — 祝你玩得开心','color:#26a69a');
  }

  if (document.readyState==='loading') addEventListener('DOMContentLoaded',init);
  else init();
})();

</script>
<script>

/* ============================================================
 * SOLCAT 专属彩蛋（由升级脚本注入，保持单文件）
 * ============================================================ */
(function(){
  var E=window.__SOLCAT_EGG__; if(!E)return;
  var NAME='表格生成器', MSG='第 42 行已标记';
  function toast(msg){
    var t=document.getElementById('toast');
    if(t&&t.classList&&t.style){t.textContent='\u2620 '+msg;t.classList.add('show');
      clearTimeout(t._eggTid);t._eggTid=setTimeout(function(){t.classList.remove('show')},2600);return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99996;'+
      'background:#111;color:#fff;padding:9px 22px;border:1px solid #111;font:13px "Segoe UI","PingFang SC",sans-serif;'+
      'letter-spacing:1px;pointer-events:none;transition:opacity .5s';
    d.textContent='\u2620 '+msg;document.body.appendChild(d);
    setTimeout(function(){d.style.opacity='0'},1600);
    setTimeout(function(){d.remove()},2200);
  }
  function badge(){
    if(document.getElementById('__egg_badge'))return;
    var b=document.createElement('div');b.id='__egg_badge';
    b.style.cssText='position:fixed;bottom:14px;right:14px;z-index:99995;background:#111;color:#fff;'+
      'padding:5px 12px;font:11px monospace;letter-spacing:1px;pointer-events:none';
    b.textContent='\u2620 SOLCAT · '+NAME;document.body.appendChild(b);
  }
  E.onUnlock.push(function(k){
    if(k!=='konami')return;
    badge();toast(MSG);
  });
})();

</script>
