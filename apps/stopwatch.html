<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秒表</title>
<style>
:root { --bg:#fff; --panel-bg:#fafafa; --text:#111; --text-light:#555; --border:#000; --accent:#000; --font-mono:"Cascadia Code","SF Mono","Fira Code","Consolas","Monaco",monospace; --font-sans:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.titlebar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--panel-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.titlebar h1{font-size:1rem;font-weight:600}
.btn{padding:6px 16px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:.82rem;cursor:pointer;font-family:inherit;transition:all .1s}
.btn:hover{background:var(--accent);color:#fff}
.btn-lg{padding:12px 32px;font-size:1rem}
.help-panel{margin:0;border-bottom:1px solid var(--border);background:#fff;flex-shrink:0}
.help-panel summary{padding:8px 20px;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--text-light);user-select:none}
.help-panel summary:hover{color:var(--text)}
.help-content{padding:0 20px 14px;font-size:.78rem;color:var(--text-light);line-height:1.7}
.help-content h3{font-size:.85rem;color:var(--text);margin:8px 0 4px}
.help-content ul{padding-left:18px;margin:2px 0 6px}
.help-content kbd{padding:1px 6px;border:1px solid var(--border);font-family:var(--font-mono);font-size:.72rem;background:#f5f5f5}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:32px 20px;gap:20px}
.timer-display{font-family:var(--font-mono);font-size:4rem;font-weight:300;letter-spacing:4px;color:var(--text);padding:20px 40px;border:2px solid var(--border);background:var(--panel-bg);min-width:360px;text-align:center}
.timer-display .ms{font-size:2rem;color:var(--text-light)}
.btn-row{display:flex;gap:12px}
.lap-section{width:100%;max-width:500px;border:1px solid var(--border);max-height:300px;overflow-y:auto}
.lap-section h3{font-size:.85rem;font-weight:600;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--panel-bg);position:sticky;top:0}
.lap-list{list-style:none}
.lap-item{display:flex;justify-content:space-between;padding:8px 14px;border-bottom:1px solid #eee;font-family:var(--font-mono);font-size:.85rem}
.lap-item:last-child{border-bottom:none}
.lap-item .lap-num{color:var(--text-light);min-width:40px}
.lap-item .lap-time{font-weight:600}
.lap-item .lap-total{color:var(--text-light)}
</style>
</head>
<body>
<div class="titlebar"><h1>秒表</h1></div>
<details class="help-panel" open>
<summary>使用说明</summary>
<div class="help-content">
<h3>秒表</h3>
<p>高精度毫秒级秒表，支持分段计时。<kbd>Space</kbd> 键快速启停。</p>
<h3>操作</h3>
<ul><li><strong>开始/暂停</strong>：点击按钮或按空格键，秒表从暂停处继续</li><li><strong>分段计时</strong>：秒表运行中点击"分段"，记录当前时间点</li><li><strong>重置</strong>：停止秒表并归零，清空分段记录</li></ul>
</div>
</details>
<div class="main">
<div class="timer-display" id="timerDisplay">00:00.000</div>
<div class="btn-row">
<button class="btn btn-lg" id="btnStart" onclick="toggle()">开始</button>
<button class="btn btn-lg" id="btnLap" onclick="lap()" disabled>分段</button>
<button class="btn btn-lg" id="btnReset" onclick="reset()">重置</button>
</div>
<div class="lap-section" id="lapSec" style="display:none">
<h3>分段记录</h3>
<ul class="lap-list" id="lapList"></ul>
</div>
</div>
<script>
let st=0,el=0,tid=null,run=false,laps=[],ll=0;
function pad(n,w){return String(n).padStart(w,'0')}
function fmt(ms){let m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000),mi=ms%1000;return pad(m,2)+':'+pad(s,2)+'.'+pad(mi,3)}
function upd(){document.getElementById('timerDisplay').innerHTML=fmt(el).replace(/(\.\d{3})/,'<span class="ms">$1</span>')}
function toggle(){run?pause():start()}
function start(){if(run)return;st=Date.now()-el;tid=setInterval(()=>{el=Date.now()-st;upd()},31);run=true;document.getElementById('btnStart').textContent='暂停';document.getElementById('btnLap').disabled=false}
function pause(){if(!run)return;clearInterval(tid);tid=null;run=false;document.getElementById('btnStart').textContent='开始';document.getElementById('btnLap').disabled=true}
function lap(){if(!run)return;let n=Date.now()-st,d=n-ll;ll=n;laps.push({t:n,d});renderLaps();document.getElementById('lapSec').style.display='block'}
function reset(){pause();el=0;ll=0;laps=[];upd();document.getElementById('lapList').innerHTML='';document.getElementById('lapSec').style.display='none'}
function renderLaps(){let h='';for(let i=laps.length-1;i>=0;i--){let l=laps[i];h+='<li class="lap-item"><span class="lap-num">#'+(i+1)+'</span><span class="lap-time">+'+fmt(l.d)+'</span><span class="lap-total">'+fmt(l.t)+'</span></li>'}document.getElementById('lapList').innerHTML=h}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('input,textarea')){e.preventDefault();toggle()}});
upd();
</script>
<script>
/* ============================================================
 * SOLCAT EASTER EGG PROTOCOL v2.0 — 通用彩蛋引擎
 * 零依赖 · 单文件 · 可注入任意 HTML 项目
 * ============================================================ */
(function(){
  'use strict';
  if (window.__SOLCAT_EGG__) return;
  window.__SOLCAT_EGG__ = { version:'2.0', unlocked:new Set(), onUnlock:[] };

  var E = window.__SOLCAT_EGG__;
  var KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  var seq = [], logoClicks = 0, logoTimer = null;

  /* ---------- 1. 控制台署名（ASCII Art） ---------- */
  function banner(){
    var art = '%c\n  ____             _   _       _   _   \n' +
      ' / ___|  ___  _ __| |_(_) __ _| |_| |__  \n' +
      ' \\___ \\ / _ \\| \'__| __| |/ _` | __| \'_ \\ \n' +
      '  ___) | (_) | |  | |_| | (_| | |_| | | |\n' +
      ' |____/ \\___/|_|   \\__|_|\\__,_|\\__|_| |_|\n';
    console.log(art, 'color:#26a69a;font-family:monospace;font-weight:bold');
    console.log('%c☠ SOLCAT EASTER EGG PROTOCOL v2.0 — 你找到了隐藏入口',
      'color:#666;font-size:11px;letter-spacing:1px');
    console.log('%c提示：↑↑↓↓←→←→BA · 连点标题 5 次 · 输入 solcat · Ctrl+Shift+T',
      'color:#999;font-size:10px');
  }

  /* ---------- 2. 烟花彩带粒子 ---------- */
  function confetti(){
    var colors = ['#26a69a','#42a5f5','#ef5350','#ffca28','#ab47bc','#66bb6a','#ff7043'];
    var cvs = document.createElement('canvas');
    cvs.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999';
    document.body.appendChild(cvs);
    var ctx = cvs.getContext('2d'), W = cvs.width = innerWidth, H = cvs.height = innerHeight;
    var P = [];
    for (var i=0;i<180;i++) P.push({
      x:W/2+(Math.random()-.5)*120, y:H*.4+(Math.random()-.5)*40,
      vx:(Math.random()-.5)*18, vy:-Math.random()*16-4,
      c:colors[i%colors.length], s:Math.random()*8+4, r:Math.random()*6,
      life:1, spin:(Math.random()-.5)*.3
    });
    var f = 0;
    (function draw(){
      f++; ctx.clearRect(0,0,W,H);
      P.forEach(function(p){
        p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.vx*=.99; p.r+=p.spin; p.life-=.006;
        if(p.life<=0) return;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=p.life;
        ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore();
      });
      if (f<180) requestAnimationFrame(draw); else cvs.remove();
    })();
  }

  /* ---------- 3. 隐藏开发者面板 ---------- */
  function devPanel(app){
    var old = document.getElementById('__egg_panel');
    if (old){ old.remove(); return; }
    var d = document.createElement('div');
    d.id='__egg_panel';
    d.style.cssText='position:fixed;bottom:20px;right:20px;z-index:99998;width:280px;'+
      'background:rgba(18,20,26,.94);color:#e0e0e0;border:1px solid #26a69a;border-radius:14px;'+
      'padding:18px;font:12px/1.7 ui-monospace,monospace;backdrop-filter:blur(12px);'+
      'box-shadow:0 12px 40px rgba(0,0,0,.4);animation:eggIn .3s ease';
    d.innerHTML='<div style="color:#26a69a;font-weight:bold;font-size:13px;margin-bottom:10px">'+
      '☠ SOLCAT 开发者模式</div>'+
      '<div>应用　　: '+app+'</div>'+
      '<div>协议　　: EGG PROTOCOL v'+E.version+'</div>'+
      '<div>解锁数　: '+E.unlocked.size+'</div>'+
      '<div>UA　　　: '+(navigator.userAgent.slice(0,38))+'…</div>'+
      '<div>屏幕　　: '+innerWidth+'×'+innerHeight+'</div>'+
      '<div>运行时间: '+Math.round(performance.now()/1000)+'s</div>'+
      '<div style="color:#888;margin-top:10px;border-top:1px solid #333;padding-top:8px">'+
      '已解锁: '+Array.from(E.unlocked).join(', ')+'</div>'+
      '<button onclick="this.parentNode.remove()" style="margin-top:12px;width:100%;padding:6px;'+
      'background:#26a69a;color:#fff;border:0;border-radius:6px;cursor:pointer">关闭</button>';
    document.body.appendChild(d);
  }

  /* ---------- 4. 隐藏主题（赛博朋克） ---------- */
  function cyberTheme(){
    var s=document.getElementById('__egg_cyber');
    if(s){ s.remove(); document.body.classList.remove('egg-cyber'); return; }
    s=document.createElement('style'); s.id='__egg_cyber';
    s.textContent='body.egg-cyber{filter:invert(1) hue-rotate(180deg)!important;}'+
      'body.egg-cyber *{font-family:"Courier New",monospace!important;letter-spacing:1px}';
    document.head.appendChild(s); document.body.classList.add('egg-cyber');
    unlock('cyber','☠ 赛博模式已启用');
  }

  /* ---------- 5. 解锁分发 ---------- */
  function unlock(id,msg){
    if (E.unlocked.has(id)) return;
    E.unlocked.add(id);
    if (msg) console.log('%c[EGG] '+msg,'color:#ffca28;font-weight:bold');
    E.onUnlock.forEach(function(fn){ try{fn(id);}catch(e){} });
    var t=document.createElement('div');
    t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);'+
      'z-index:99997;background:rgba(18,20,26,.92);color:#ffca28;padding:18px 28px;'+ 
      'border:1px solid #ffca28;border-radius:12px;font:14px ui-monospace,monospace;'+
      'pointer-events:none;animation:eggIn .3s ease;box-shadow:0 8px 30px rgba(0,0,0,.4)';
    t.textContent='☠ '+msg;
    document.body.appendChild(t); setTimeout(function(){t.remove();},2200);
  }

  /* ---------- 6. 事件绑定 ---------- */
  function init(){
    var app = document.title || 'SOLCAT App';
    banner();

    // Konami 秘籍
    addEventListener('keydown', function(e){
      var k = e.key.length===1 ? e.key.toLowerCase() : e.key;
      seq.push(k); if(seq.length>KONAMI.length) seq.shift();
      if (seq.length===KONAMI.length && KONAMI.every(function(v,i){return seq[i]===v;})){
        seq=[]; confetti(); unlock('konami','KONAMI CODE 已激活！');
      }
      // Ctrl+Shift+T → 赛博主题
      if (e.ctrlKey && e.shiftKey && (e.key==='T'||e.key==='t')){
        e.preventDefault(); cyberTheme();
      }
      // 输入 solcat
      if (e.key==='Enter' && window.__eggBuf__ === 'solcat'){ cyberTheme(); window.__eggBuf__=''; }
      if (k.length===1) window.__eggBuf__ = ((window.__eggBuf__||'')+k).slice(-10);
    });

    // 连点标题 5 次 → 开发者面板
    addEventListener('DOMContentLoaded', function(){
      var targets = document.querySelectorAll('h1,.head h1,.logo,header h1');
      var t = targets[0];
      if(t){ t.style.cursor='default'; t.addEventListener('click',function(){
        logoClicks++;
        clearTimeout(logoTimer);
        logoTimer=setTimeout(function(){logoClicks=0;},900);
        if(logoClicks>=5){ logoClicks=0; devPanel(app); unlock('dev','开发者模式已解锁'); }
      });}
      // 给 body 加动画 keyframe
      var a=document.createElement('style');
      a.textContent='@keyframes eggIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}';
      document.head.appendChild(a);
    });

    console.log('%c☠ 彩蛋引擎已加载 — 祝你玩得开心','color:#26a69a');
  }

  if (document.readyState==='loading') addEventListener('DOMContentLoaded',init);
  else init();
})();

</script>
<script>

/* ============================================================
 * SOLCAT 专属彩蛋（由升级脚本注入，保持单文件）
 * ============================================================ */
(function(){
  var E=window.__SOLCAT_EGG__; if(!E)return;
  var NAME='秒表', MSG='第 42 圈彩蛋';
  function toast(msg){
    var t=document.getElementById('toast');
    if(t&&t.classList&&t.style){t.textContent='\u2620 '+msg;t.classList.add('show');
      clearTimeout(t._eggTid);t._eggTid=setTimeout(function(){t.classList.remove('show')},2600);return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:99996;'+
      'background:#111;color:#fff;padding:9px 22px;border:1px solid #111;font:13px "Segoe UI","PingFang SC",sans-serif;'+
      'letter-spacing:1px;pointer-events:none;transition:opacity .5s';
    d.textContent='\u2620 '+msg;document.body.appendChild(d);
    setTimeout(function(){d.style.opacity='0'},1600);
    setTimeout(function(){d.remove()},2200);
  }
  function badge(){
    if(document.getElementById('__egg_badge'))return;
    var b=document.createElement('div');b.id='__egg_badge';
    b.style.cssText='position:fixed;bottom:14px;right:14px;z-index:99995;background:#111;color:#fff;'+
      'padding:5px 12px;font:11px monospace;letter-spacing:1px;pointer-events:none';
    b.textContent='\u2620 SOLCAT · '+NAME;document.body.appendChild(b);
  }
  E.onUnlock.push(function(k){
    if(k!=='konami')return;
    badge();toast(MSG);
  });
})();

</script>
</body>
</html>
