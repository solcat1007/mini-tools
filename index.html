<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Tools - 实用工具箱</title>
<style>
/* ============================================================
   CSS 变量 & 全局重置 — 白色极简主题
   ============================================================ */
:root {
  --bg: #ffffff;
  --card-bg: #ffffff;
  --text: #111111;
  --text-light: #555555;
  --border: #000000;
  --primary: #000000;
  --primary-light: #555555;
  --primary-dark: #111111;
  --success: #111111;
  --danger: #cc0000;
  --warning: #000000;
  --radius: 0px;
  --shadow: none;
  --transition: 0.1s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

/* ============================================================
   顶部标题栏
   ============================================================ */
.header {
  background: var(--card-bg);
  color: var(--text);
  padding: 20px 24px;
  text-align: center;
  border-bottom: 2px solid var(--border);
}
.header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.5px; }
.header p  { font-size: 0.85rem; color: var(--text-light); margin-top: 4px; }

/* ============================================================
   Tab 导航栏
   ============================================================ */
.tab-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  padding: 0;
  justify-content: center;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}
.tab-btn {
  padding: 8px 18px;
  border: none;
  border-bottom: 2px solid transparent;
  background: #fff;
  color: var(--text-light);
  font-size: 0.9rem;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); border-bottom-color: #ccc; }
.tab-btn.active {
  color: var(--text);
  border-bottom-color: var(--border);
  font-weight: 600;
}

/* ============================================================
   主内容区
   ============================================================ */
.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px;
}
.tool-panel {
  display: none;
}
.tool-panel.active { display: block; }

/* 通用卡片 */
.card {
  background: var(--card-bg);
  padding: 20px;
  border: 1px solid var(--border);
}
.card-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
}

/* 通用按钮 */
.btn {
  padding: 8px 18px;
  border: 1px solid var(--border);
  font-size: 0.88rem;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
  background: #fff;
  color: var(--text);
}
.btn:hover { background: var(--primary); color: #fff; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline {
  background: #fff;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-outline:hover { background: var(--primary); color: #fff; }
.btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-success { background: #fff; color: var(--text); border: 1px solid var(--border); }
.btn-success:hover { background: var(--primary); color: #fff; }
.btn-sm { padding: 4px 12px; font-size: 0.78rem; }

/* 通用 textarea */
textarea.code-area {
  width: 100%;
  min-height: 220px;
  padding: 14px;
  border: 1px solid var(--border);
  font-family: "SF Mono", "Fira Code", "Consolas", "Monaco", monospace;
  font-size: 0.9rem;
  line-height: 1.5;
  resize: vertical;
  background: #fff;
  transition: border-color var(--transition);
}
textarea.code-area:focus {
  outline: none;
  border-color: var(--border);
  border-width: 2px;
}

/* ============================================================
   工具1：Markdown 编辑器（左右分栏）
   ============================================================ */
.md-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  min-height: 460px;
}
.md-panel {
  display: flex;
  flex-direction: column;
}
.md-panel .card-title { flex-shrink: 0; }
.md-panel textarea,
.md-preview {
  flex: 1;
  min-height: 360px;
}
.md-preview {
  padding: 16px;
  border: 1px solid var(--border);
  overflow-y: auto;
  background: #fff;
  word-wrap: break-word;
}

/* Markdown 渲染样式 */
.md-preview h1 { font-size: 1.6rem; border-bottom: 2px solid var(--border); padding-bottom: 6px; margin: 16px 0 10px; }
.md-preview h2 { font-size: 1.35rem; border-bottom: 1px solid var(--border); padding-bottom: 4px; margin: 14px 0 8px; }
.md-preview h3 { font-size: 1.15rem; margin: 12px 0 6px; }
.md-preview h4, .md-preview h5, .md-preview h6 { font-size: 1rem; margin: 10px 0 6px; color: #555; }
.md-preview p  { margin: 8px 0; }
.md-preview ul, .md-preview ol { padding-left: 24px; margin: 8px 0; }
.md-preview li { margin: 3px 0; }
.md-preview blockquote {
  border-left: 4px solid var(--border);
  padding: 8px 14px;
  margin: 10px 0;
  background: #fafafa;
  color: #555;
}
.md-preview code {
  background: #f0f0f0;
  padding: 2px 6px;
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  font-size: 0.88em;
  color: var(--text);
}
.md-preview pre {
  background: #fafafa;
  color: var(--text);
  padding: 14px 16px;
  overflow-x: auto;
  margin: 10px 0;
  line-height: 1.5;
  border: 1px solid var(--border);
}
.md-preview pre code {
  background: none;
  color: inherit;
  padding: 0;
  font-size: 0.85rem;
}
.md-preview a { color: var(--text); text-decoration: underline; }
.md-preview a:hover { color: var(--text-light); }
.md-preview img { max-width: 100%; margin: 8px 0; }
.md-preview hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.md-preview table { border-collapse: collapse; width: 100%; margin: 10px 0; }
.md-preview th, .md-preview td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.md-preview th { background: #f5f5f5; font-weight: 600; }
.md-preview strong { color: #111; }

/* ============================================================
   工具2：JSON 工具
   ============================================================ */
.json-result {
  margin-top: 12px;
  padding: 14px;
  min-height: 40px;
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  font-size: 0.85rem;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-all;
}
.json-result.success {
  background: #fafafa;
  border: 1px solid var(--border);
  color: var(--text);
}
.json-result.error {
  background: #fff5f5;
  border: 1px solid var(--danger);
  color: #822727;
}
.json-stats {
  display: flex;
  gap: 12px;
  margin-top: 8px;
  font-size: 0.82rem;
  color: var(--text-light);
  flex-wrap: wrap;
}

/* ============================================================
   工具3：颜色拾取器
   ============================================================ */
.color-container {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
  align-items: start;
}
.color-picker-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.color-preview {
  width: 160px;
  height: 160px;
  border: 2px solid var(--border);
  transition: background 0.15s;
}
.color-input-native {
  width: 100%;
  height: 40px;
  border: 1px solid var(--border);
  cursor: pointer;
  background: none;
}
.color-values {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}
.color-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
}
.color-row label {
  width: 32px;
  font-weight: 600;
  color: var(--text-light);
  flex-shrink: 0;
}
.color-row input {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid var(--border);
  font-family: "SF Mono", "Consolas", monospace;
  font-size: 0.85rem;
}
.color-row input:focus {
  outline: none;
  border-width: 2px;
}
/* 调色板预设 */
.palette-section { display: flex; flex-direction: column; gap: 10px; }
.palette-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
  gap: 6px;
}
.palette-swatch {
  width: 100%;
  aspect-ratio: 1;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.15s;
}
.palette-swatch:hover {
  border-color: var(--border);
}
.palette-label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-light);
  margin-bottom: 2px;
}

/* ============================================================
   工具4：计时器
   ============================================================ */
.timer-display {
  text-align: center;
  font-size: 3.5rem;
  font-weight: 700;
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  color: var(--text);
  padding: 20px;
  letter-spacing: 2px;
}
.timer-display.warning { color: var(--danger); }
.timer-display.danger  { color: var(--danger); animation: pulse 0.8s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.timer-controls {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 10px 0;
}
.timer-presets {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
}
.timer-input-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}
.timer-input-row input {
  width: 60px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  font-size: 0.9rem;
  text-align: center;
  font-family: inherit;
}
.timer-input-row input:focus { outline: none; border-width: 2px; }
.timer-input-row span { font-size: 0.85rem; color: var(--text-light); }

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 768px) {
  .md-container { grid-template-columns: 1fr; }
  .color-container { grid-template-columns: 1fr; }
  .tab-nav { gap: 4px; padding: 10px 12px; }
  .tab-btn { padding: 6px 12px; font-size: 0.8rem; }
  .timer-display { font-size: 2.5rem; }
  .header h1 { font-size: 1.3rem; }
  .main { padding: 12px; }
}

/* ============================================================
   页脚
   ============================================================ */
.footer {
  text-align: center;
  padding: 16px;
  font-size: 0.78rem;
  color: var(--text-light);
  border-top: 1px solid var(--border);
  margin-top: 20px;
}
</style>
</head>
<body>

<!-- ===== 顶部 ===== -->
<div class="header">
  <h1>🛠 Mini Tools</h1>
  <p>轻量级在线实用工具箱 — 无需安装，浏览器即用</p>
</div>

<!-- ===== Tab 导航 ===== -->
<nav class="tab-nav" id="tabNav">
  <button class="tab-btn active" data-tab="markdown">📝 Markdown 编辑器</button>
  <button class="tab-btn" data-tab="json">🔧 JSON 格式化</button>
  <button class="tab-btn" data-tab="color">🎨 颜色拾取器</button>
  <button class="tab-btn" data-tab="timer">⏱ 计时器</button>
</nav>

<!-- ===== 主内容 ===== -->
<div class="main">

  <!-- ========== Markdown 编辑器 ========== -->
  <div class="tool-panel active" id="panel-markdown">
    <div class="md-container">
      <!-- 编辑区 -->
      <div class="md-panel card">
        <div class="card-title">编辑区</div>
        <textarea class="code-area" id="mdInput" placeholder="# 在此输入 Markdown 文本...
        
## 支持语法
- **加粗** 和 *斜体*
- 代码块和 `行内代码`
- 链接与图片
- 表格和引用

实时预览在右侧 →"></textarea>
      </div>
      <!-- 预览区 -->
      <div class="md-panel card">
        <div class="card-title">预览区</div>
        <div class="md-preview" id="mdPreview"></div>
      </div>
    </div>
  </div>

  <!-- ========== JSON 格式化 ========== -->
  <div class="tool-panel" id="panel-json">
    <div class="card" style="margin-bottom:12px">
      <div class="card-title">输入 JSON 文本</div>
      <textarea class="code-area" id="jsonInput" placeholder='粘贴 JSON 字符串，例如：
{"name":"张三","age":25,"hobbies":["读书","编程"]}'></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn btn-primary" id="btnFormat">格式化</button>
        <button class="btn btn-outline" id="btnCompact">压缩</button>
        <button class="btn btn-outline" id="btnValidate">校验</button>
        <button class="btn btn-outline" id="btnJsonClear">清空</button>
        <button class="btn btn-outline" id="btnEscape">转义</button>
        <button class="btn btn-outline" id="btnUnescape">反转义</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">结果</div>
      <div class="json-result" id="jsonResult">等待输入...</div>
      <div class="json-stats" id="jsonStats"></div>
    </div>
  </div>

  <!-- ========== 颜色拾取器 ========== -->
  <div class="tool-panel" id="panel-color">
    <div class="color-container">
      <!-- 左侧：拾取器 -->
      <div class="card color-picker-section">
        <div class="color-preview" id="colorPreview" style="background:#6c5ce7"></div>
        <input type="color" class="color-input-native" id="colorPicker" value="#6c5ce7">
        <div class="color-values">
          <div class="color-row"><label>HEX</label><input type="text" id="colorHex" value="#6C5CE7" readonly></div>
          <div class="color-row"><label>RGB</label><input type="text" id="colorRgb" value="rgb(108, 92, 231)" readonly></div>
          <div class="color-row"><label>HSL</label><input type="text" id="colorHsl" value="hsl(247, 74%, 63%)" readonly></div>
        </div>
        <button class="btn btn-outline btn-sm" id="btnCopyColor">📋 复制 HEX</button>
      </div>
      <!-- 右侧：预设调色板 -->
      <div class="card palette-section">
        <!-- 常用色 -->
        <div class="palette-label">🎯 常用色</div>
        <div class="palette-grid" id="paletteCommon"></div>
        <!-- 暖色系 -->
        <div class="palette-label">🔥 暖色系</div>
        <div class="palette-grid" id="paletteWarm"></div>
        <!-- 冷色系 -->
        <div class="palette-label">❄️ 冷色系</div>
        <div class="palette-grid" id="paletteCool"></div>
        <!-- 自然色 -->
        <div class="palette-label">🌿 自然色</div>
        <div class="palette-grid" id="paletteNature"></div>
      </div>
    </div>
  </div>

  <!-- ========== 计时器 ========== -->
  <div class="tool-panel" id="panel-timer">
    <div class="card" style="text-align:center">
      <div class="timer-display" id="timerDisplay">00:00:00</div>
      <div style="margin-bottom:8px;font-size:0.85rem;color:var(--text-light)" id="timerLabel">计时器</div>
      <div class="timer-input-row" style="margin-bottom:10px">
        <input type="number" id="inputHours" placeholder="时" min="0" max="99" value="0">
        <span>时</span>
        <input type="number" id="inputMinutes" placeholder="分" min="0" max="59" value="5">
        <span>分</span>
        <input type="number" id="inputSeconds" placeholder="秒" min="0" max="59" value="0">
        <span>秒</span>
      </div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="btnTimerStart">▶ 开始</button>
        <button class="btn btn-outline" id="btnTimerPause">⏸ 暂停</button>
        <button class="btn btn-outline" id="btnTimerReset">↺ 重置</button>
      </div>
      <div class="timer-presets" style="margin-top:8px">
        <button class="btn btn-outline btn-sm timer-preset" data-sec="60">1 分钟</button>
        <button class="btn btn-outline btn-sm timer-preset" data-sec="180">3 分钟</button>
        <button class="btn btn-outline btn-sm timer-preset" data-sec="300">5 分钟</button>
        <button class="btn btn-outline btn-sm timer-preset" data-sec="600">10 分钟</button>
        <button class="btn btn-outline btn-sm timer-preset" data-sec="1500">25 分钟</button>
      </div>
      <div style="margin-top:10px">
        <label style="font-size:0.85rem;cursor:pointer;user-select:none">
          <input type="checkbox" id="chkCountUp" style="margin-right:4px">
          正向计时模式（从 0 开始累加）
        </label>
      </div>
    </div>
  </div>

</div>

<!-- ===== 页脚 ===== -->
<div class="footer">
  Mini Tools — 纯原生 HTML/CSS/JS，无外部依赖，MIT 协议开源
</div>

<!-- ============================================================
     JavaScript 主体逻辑
     ============================================================ -->
<script>
(function() {
  'use strict';

  /* ==========================================================
     Tab 切换逻辑
     ========================================================== */
  const tabBtns   = document.querySelectorAll('.tab-btn');
  const panels    = document.querySelectorAll('.tool-panel');

  tabBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var tabId = btn.getAttribute('data-tab');
      // 移除所有 active
      tabBtns.forEach(function(b) { b.classList.remove('active'); });
      panels.forEach(function(p) { p.classList.remove('active'); });
      // 激活当前
      btn.classList.add('active');
      var panel = document.getElementById('panel-' + tabId);
      if (panel) { panel.classList.add('active'); }
    });
  });

  /* ==========================================================
     工具1：简易 Markdown 解析器 & 实时预览
     （纯原生实现，支持常用 Markdown 语法）
     ========================================================== */

  /**
   * 简易 Markdown → HTML 转换器
   * 支持的语法：
   *   标题 #~######  |  加粗/斜体  |  行内代码  |  代码块(```)
   *   无序/有序列表  |  引用(>)  |  链接/图片  |  分割线  |  表格
   * @param {string} md - 原始 Markdown 文本
   * @returns {string} HTML 字符串
   */
  function parseMarkdown(md) {
    if (!md) return '<p style="color:#aaa">预览内容将显示在这里...</p>';

    // 转义 HTML 特殊字符，防止 XSS
    var escaped = md
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    var html = escaped;
    var lines = html.split('\n');
    var result = [];
    var inCodeBlock = false;   // 是否在代码块内部
    var codeBlockContent = []; // 代码块内容缓存
    var codeBlockLang = '';    // 代码块语言标注
    var inList = false;        // 是否在列表内部（用于包裹 <ul>/<ol>）
    var listType = '';         // 'ul' 或 'ol'
    var inTable = false;       // 是否在表格内部
    var tableRows = [];        // 表格行缓存
    var inBlockquote = false;  // 是否在引用块内部

    /**
     * 刷新缓冲区：将当前列表/表格/引用关闭标签写入 result
     */
    function flushList() {
      if (inList) {
        result.push('</' + listType + '>');
        inList = false;
        listType = '';
      }
    }

    function flushTable() {
      if (inTable) {
        result.push(renderTable(tableRows));
        inTable = false;
        tableRows = [];
      }
    }

    function flushBlockquote() {
      if (inBlockquote) {
        result.push('</blockquote>');
        inBlockquote = false;
      }
    }

    function flushAll() {
      flushList();
      flushTable();
      flushBlockquote();
    }

    /*
     * 渲染表格
     * 输入：二维数组，第一行为表头，第二行为分隔行（忽略），后续为数据行
     */
    function renderTable(rows) {
      if (rows.length < 2) return '';
      var h = '<table>';
      // 表头
      var headerCells = rows[0];
      h += '<thead><tr>';
      headerCells.forEach(function(cell) {
        h += '<th>' + cell.trim() + '</th>';
      });
      h += '</tr></thead><tbody>';
      // 数据行（跳过第2行即分隔行）
      for (var i = 2; i < rows.length; i++) {
        h += '<tr>';
        var dataCells = rows[i];
        dataCells.forEach(function(cell) {
          h += '<td>' + cell.trim() + '</td>';
        });
        h += '</tr>';
      }
      h += '</tbody></table>';
      return h;
    }

    // 处理行内元素的正则（在行处理函数中使用）
    function parseInline(text) {
      // 图片 ![alt](url) — 必须在链接之前处理
      text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
      // 链接 [text](url)
      text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      // 加粗 **text**
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      // 斜体 *text*（注意不要与 ** 冲突，已处理 ** 后再处理单 *）
      text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
      // 行内代码 `text`
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      // 删除线 ~~text~~
      text = text.replace(/~~(.+?)~~/g, '<del>$1</del>');
      return text;
    }

    // 逐行处理
    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var line = raw.trim();

      // --- 代码块处理 ---
      if (/^```/.test(line)) {
        if (!inCodeBlock) {
          // 进入代码块：先刷新所有缓冲区
          flushAll();
          inCodeBlock = true;
          codeBlockContent = [];
          // 提取语言标注（如 ```javascript）
          codeBlockLang = line.slice(3).trim();
        } else {
          // 退出代码块
          var codeHtml = codeBlockContent.join('\n');
          // 对代码块内容做一次 HTML 转义（因为外层 escaped 已经转义过，
          // 但代码块内需要保留原始缩进和特殊字符的转义版本）
          result.push('<pre><code' + (codeBlockLang ? ' class="language-' + codeBlockLang + '"' : '') + '>' + codeHtml + '</code></pre>');
          inCodeBlock = false;
          codeBlockLang = '';
        }
        continue;
      }
      if (inCodeBlock) {
        codeBlockContent.push(raw); // 保留原始行（含缩进）
        continue;
      }

      // --- 表格处理 ---
      // 检测表格行：以 | 开头或包含 | 分隔符
      var isTableLine = /^\|.*\|$/.test(line) || /^[^|]+\|.+[^|]$/.test(line);
      if (isTableLine) {
        flushList();
        flushBlockquote();
        if (!inTable) { inTable = true; tableRows = []; }
        // 拆分单元格
        var cells = line.split('|');
        // 去除首尾空元素
        if (cells.length > 1 && cells[0].trim() === '') cells.shift();
        if (cells.length > 1 && cells[cells.length - 1].trim() === '') cells.pop();
        tableRows.push(cells);
        // 检查下一行是否还是表格行
        if (i + 1 < lines.length) {
          var nextLine = lines[i + 1].trim();
          if (/^\|.*\|$/.test(nextLine) || /^[^|]+\|.+[^|]$/.test(nextLine)) {
            continue;
          }
        }
        flushTable();
        continue;
      }

      // --- 引用块 ---
      if (/^&gt;\s?/.test(line)) {
        flushList();
        flushTable();
        var quoteContent = line.replace(/^&gt;\s?/, '');
        quoteContent = parseInline(quoteContent);
        if (!inBlockquote) {
          result.push('<blockquote>');
          inBlockquote = true;
        }
        result.push('<p>' + quoteContent + '</p>');
        continue;
      } else {
        flushBlockquote();
      }

      // --- 空行 ---
      if (line === '') {
        flushAll();
        continue;
      }

      // --- 分割线 ---
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(line)) {
        flushAll();
        result.push('<hr>');
        continue;
      }

      // --- 标题 ---
      var headingMatch = line.match(/^(#{1,6})\s+(.+)$/);
      if (headingMatch) {
        flushAll();
        var level = headingMatch[1].length;
        var text  = parseInline(headingMatch[2]);
        result.push('<h' + level + '>' + text + '</h' + level + '>');
        continue;
      }

      // --- 无序列表 ---
      var ulMatch = line.match(/^[\-\*]\s+(.+)$/);
      if (ulMatch) {
        flushTable();
        flushBlockquote();
        if (!inList || listType !== 'ul') {
          flushList();
          result.push('<ul>');
          inList = true;
          listType = 'ul';
        }
        result.push('<li>' + parseInline(ulMatch[1]) + '</li>');
        continue;
      }

      // --- 有序列表 ---
      var olMatch = line.match(/^(\d+)\.\s+(.+)$/);
      if (olMatch) {
        flushTable();
        flushBlockquote();
        if (!inList || listType !== 'ol') {
          flushList();
          result.push('<ol>');
          inList = true;
          listType = 'ol';
        }
        result.push('<li>' + parseInline(olMatch[2]) + '</li>');
        continue;
      }

      // --- 普通段落 ---
      flushAll();
      result.push('<p>' + parseInline(line) + '</p>');
    } // end for

    // 收尾：确保所有缓冲区关闭
    if (inCodeBlock) {
      result.push('<pre><code>' + codeBlockContent.join('\n') + '</code></pre>');
    }
    flushAll();

    return result.join('\n');
  }

  /* ==========================================================
     工具2：JSON 格式化 / 校验 / 压缩
     ========================================================== */
  var jsonInput  = document.getElementById('jsonInput');
  var jsonResult = document.getElementById('jsonResult');
  var jsonStats  = document.getElementById('jsonStats');

  /**
   * 设置 JSON 结果区域的样式和内容
   */
  function setJsonResult(type, message, stats) {
    jsonResult.className = 'json-result ' + type;
    jsonResult.textContent = message;
    jsonStats.textContent = stats || '';
  }

  /**
   * 尝试解析 JSON，返回 { ok, data } 或 { ok, error }
   */
  function tryParseJSON(str) {
    try {
      var data = JSON.parse(str);
      return { ok: true, data: data };
    } catch(e) {
      return { ok: false, error: e.message };
    }
  }

  // 格式化按钮
  document.getElementById('btnFormat').addEventListener('click', function() {
    var parsed = tryParseJSON(jsonInput.value);
    if (!parsed.ok) {
      setJsonResult('error', '❌ JSON 解析失败：' + parsed.error);
      return;
    }
    var formatted = JSON.stringify(parsed.data, null, 2);
    var size = new Blob([formatted]).size;
    setJsonResult('success', formatted,
      '格式化成功 | 大小：' + (size / 1024).toFixed(2) + ' KB | ' +
      '顶层类型：' + (Array.isArray(parsed.data) ? 'Array' : typeof parsed.data));
    jsonInput.value = formatted;
  });

  // 压缩按钮
  document.getElementById('btnCompact').addEventListener('click', function() {
    var parsed = tryParseJSON(jsonInput.value);
    if (!parsed.ok) {
      setJsonResult('error', '❌ JSON 解析失败：' + parsed.error);
      return;
    }
    var compacted = JSON.stringify(parsed.data);
    var size = new Blob([compacted]).size;
    setJsonResult('success', compacted,
      '压缩成功 | 大小：' + (size / 1024).toFixed(2) + ' KB');
    jsonInput.value = compacted;
  });

  // 校验按钮
  document.getElementById('btnValidate').addEventListener('click', function() {
    var parsed = tryParseJSON(jsonInput.value);
    if (parsed.ok) {
      var type = Array.isArray(parsed.data) ? 'Array' : typeof parsed.data;
      var keys = type === 'object' ? Object.keys(parsed.data).length : 0;
      setJsonResult('success', '✅ JSON 格式正确',
        '顶层类型：' + type + (keys ? ' | 键数量：' + keys : ''));
    } else {
      setJsonResult('error', '❌ ' + parsed.error);
    }
  });

  // 清空
  document.getElementById('btnJsonClear').addEventListener('click', function() {
    jsonInput.value = '';
    setJsonResult('success', '等待输入...');
  });

  // 转义（将 JSON 字符串转为可嵌入代码的字符串）
  document.getElementById('btnEscape').addEventListener('click', function() {
    var escaped = JSON.stringify(jsonInput.value);
    setJsonResult('success', escaped, '转义完成');
    jsonInput.value = escaped;
  });

  // 反转义
  document.getElementById('btnUnescape').addEventListener('click', function() {
    var parsed = tryParseJSON(jsonInput.value);
    if (parsed.ok && typeof parsed.data === 'string') {
      setJsonResult('success', parsed.data, '反转义完成');
      jsonInput.value = parsed.data;
    } else {
      setJsonResult('error', '输入不是有效的 JSON 字符串字面量');
    }
  });

  /* ==========================================================
     工具3：颜色拾取器
     ========================================================== */
  var colorPicker  = document.getElementById('colorPicker');
  var colorPreview = document.getElementById('colorPreview');
  var colorHex     = document.getElementById('colorHex');
  var colorRgb     = document.getElementById('colorRgb');
  var colorHsl     = document.getElementById('colorHsl');

  /**
   * HEX → RGB 转换
   */
  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return { r: r, g: g, b: b };
  }

  /**
   * RGB → HSL 转换
   */
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h, s, l = (max + min) / 2;
    if (max === min) { h = s = 0; }
    else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      switch (max) {
        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
        case g: h = ((b - r) / d + 2) / 6; break;
        case b: h = ((r - g) / d + 4) / 6; break;
      }
    }
    return {
      h: Math.round(h * 360),
      s: Math.round(s * 100),
      l: Math.round(l * 100)
    };
  }

  /**
   * 更新颜色显示
   */
  function updateColorDisplay(hex) {
    var upperHex = hex.toUpperCase();
    colorPreview.style.background = upperHex;
    colorHex.value = upperHex;
    var rgb = hexToRgb(upperHex);
    colorRgb.value = 'rgb(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ')';
    var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
    colorHsl.value = 'hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)';
    colorPicker.value = upperHex;
  }

  // 原生取色器变更事件
  colorPicker.addEventListener('input', function() {
    updateColorDisplay(colorPicker.value);
  });

  // 复制 HEX
  document.getElementById('btnCopyColor').addEventListener('click', function() {

    } else {
      // 降级方案：使用 textarea

      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('已复制：' + hex);
    }
  });

  /**

  /* ==========================================================
     工具4：计时器 / 倒计时
     ========================================================== */
  var timerDisplay  = document.getElementById('timerDisplay');
  var timerLabel    = document.getElementById('timerLabel');
  var inputHours    = document.getElementById('inputHours');
  var inputMinutes  = document.getElementById('inputMinutes');
  var inputSeconds  = document.getElementById('inputSeconds');
  var chkCountUp    = document.getElementById('chkCountUp');

  var timerInterval = null;  // setInterval 句柄
  var totalSeconds  = 0;     // 当前剩余/累计秒数
  var isCountUp     = false; // 是否正向计时
  var isRunning     = false; // 是否运行中

  /**
   * 格式化秒数为 HH:MM:SS
   */
  function formatTime(sec) {
    var abs = Math.abs(sec);
    var h = Math.floor(abs / 3600);
    var m = Math.floor((abs % 3600) / 60);
    var s = abs % 60;
    return (h < 10 ? '0' + h : h) + ':' +
           (m < 10 ? '0' + m : m) + ':' +
           (s < 10 ? '0' + s : s);
  }

  /**
   * 更新显示
   */
  function updateTimerDisplay() {
    timerDisplay.textContent = formatTime(totalSeconds);
    // 倒计时警告色
    timerDisplay.classList.remove('warning', 'danger');
    if (!isCountUp && isRunning) {
      if (totalSeconds <= 10 && totalSeconds > 0) timerDisplay.classList.add('warning');
      if (totalSeconds <= 0) timerDisplay.classList.add('danger');
    }
  }

  /**
   * 从输入框读取时间
   */
  function readInputTime() {
    var h = parseInt(inputHours.value) || 0;
    var m = parseInt(inputMinutes.value) || 0;
    var s = parseInt(inputSeconds.value) || 0;
    return h * 3600 + m * 60 + s;
  }

  /**
   * 停止计时器
   */
  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
    isRunning = false;
  }

  /**
   * 开始计时
   */
  function startTimer() {
    if (isRunning) return; // 已在运行中

    isCountUp = chkCountUp.checked;

    if (!isCountUp) {
      // 倒计时模式：读取输入时间
      totalSeconds = readInputTime();
      if (totalSeconds <= 0) {
        alert('请设置大于 0 的倒计时时间');
        return;
      }
      timerLabel.textContent = '倒计时中...';
    } else {
      // 正向计时模式：如果之前暂停了就从当前值继续，否则从 0 开始
      if (totalSeconds === 0) {
        totalSeconds = 0;
      }
      timerLabel.textContent = '计时中...';
    }

    isRunning = true;
    updateTimerDisplay();

    timerInterval = setInterval(function() {
      if (isCountUp) {
        totalSeconds++;
      } else {
        totalSeconds--;
      }
      updateTimerDisplay();

      // 倒计时到 0 自动停止
      if (!isCountUp && totalSeconds <= 0) {
        stopTimer();
        timerLabel.textContent = '⏰ 时间到！';
        updateTimerDisplay();
      }
    }, 1000);
  }

  /**
   * 暂停
   */
  function pauseTimer() {
    stopTimer();
    if (isCountUp) {
      timerLabel.textContent = '已暂停（正向计时：' + formatTime(totalSeconds) + '）';
    } else {
      timerLabel.textContent = '已暂停（剩余：' + formatTime(totalSeconds) + '）';
    }
  }

  /**
   * 重置
   */
  function resetTimer() {
    stopTimer();
    isCountUp = chkCountUp.checked;
    if (isCountUp) {
      totalSeconds = 0;
    } else {
      totalSeconds = readInputTime();
    }
    timerLabel.textContent = isCountUp ? '计时器（就绪）' : '倒计时（就绪）';
    timerDisplay.classList.remove('warning', 'danger');
    updateTimerDisplay();
  }

  /**
   * 设置预设时间
   */
  function setPreset(sec) {
    stopTimer();
    isCountUp = false;
    chkCountUp.checked = false;
    totalSeconds = sec;
    inputHours.value   = Math.floor(sec / 3600);
    inputMinutes.value = Math.floor((sec % 3600) / 60);
    inputSeconds.value = sec % 60;
    timerLabel.textContent = '倒计时（就绪）';
    timerDisplay.classList.remove('warning', 'danger');
    updateTimerDisplay();
  }

  // 绑定按钮事件
  document.getElementById('btnTimerStart').addEventListener('click', startTimer);
  document.getElementById('btnTimerPause').addEventListener('click', pauseTimer);
  document.getElementById('btnTimerReset').addEventListener('click', resetTimer);

  // 预设按钮
  document.querySelectorAll('.timer-preset').forEach(function(btn) {
    btn.addEventListener('click', function() {
      setPreset(parseInt(btn.getAttribute('data-sec')));
    });
  });

  // 正向计时切换时自动重置
  chkCountUp.addEventListener('change', function() {
    resetTimer();
  });

  // 初始状态
  totalSeconds = readInputTime();
  updateTimerDisplay();

  // 输入框变更时同步 totalSeconds
  [inputHours, inputMinutes, inputSeconds].forEach(function(input) {
    input.addEventListener('input', function() {
      if (!isRunning) {
        totalSeconds = readInputTime();
        updateTimerDisplay();
        timerLabel.textContent = chkCountUp.checked ? '计时器（就绪）' : '倒计时（就绪）';
      }
    });
  });

})();
